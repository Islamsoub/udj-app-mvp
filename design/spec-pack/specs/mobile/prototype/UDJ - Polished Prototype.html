<style>
  html, body { margin: 0; padding: 0; background: #E7EBE8; overflow: hidden; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes udjSheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes udjPop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes udjDay { from { opacity: 0; transform: translateX(var(--udj-dx, 0)); } to { opacity: 1; transform: translateX(0); } }
  @keyframes udjPulse { 0%, 100% { box-shadow: 0 0 0 4px rgba(29,158,117,0.18); } 50% { box-shadow: 0 0 0 7px rgba(29,158,117,0.05); } }
  @keyframes udjSpin { to { transform: rotate(360deg); } }
  @keyframes udjBone { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.85; } }
  @keyframes udjBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
</style>
