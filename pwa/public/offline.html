<!doctype html>
<!--
  Offline fallback — served by public/sw.js when a navigation fails and no copy
  of that route is cached. Precached at install, with the logo and fonts it uses.

  WHY A STATIC FILE, AND WHY THE STYLES ARE COPIED HERE. Nothing hashed can be
  relied on when this page is shown: the app's CSS chunk is a build artefact
  this file cannot name. So it is fully self-contained, and the rules below are
  a copy of the session-waiting screen (components/shell/SessionWaiting.tsx,
  styled by components/login/login.module.css) with the token values from
  app/globals.css. No new colours: every value is an existing token's. If those
  tokens change, change them here too.

  LANGUAGE. The service worker cannot read React state, and cannot read cookies
  either. This page can: it is a same-origin document, so the inline script
  below reads the same `unipocket_lang` cookie the server renders from (falling
  back to the localStorage key the provider mirrors it to), and sets lang/dir
  before first paint. Both languages are in the markup; CSS shows the active
  one. Theme is resolved the same way from `unipocket_theme`.

  The strings are here, not in locales/*.json, because this page loads no
  JavaScript bundle to read them with. The university name, tagline and retry
  label are copied verbatim from app.university, app.tagline and actions.retry.
-->
<html lang="fr" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unipocket — Hors ligne</title>
<script>
  try {
    var read = function (name) {
      var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
      if (m) return decodeURIComponent(m[1]);
      try { return localStorage.getItem(name); } catch (e) { return null; }
    };
    var lang = read('unipocket_lang') === 'ar' ? 'ar' : 'fr';
    var pref = read('unipocket_theme');
    var theme = pref === 'dark' || pref === 'light'
      ? pref
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var root = document.documentElement;
    root.lang = lang;
    root.dir = lang === 'ar' ? 'rtl' : 'ltr';
    root.setAttribute('data-theme', theme);
    document.title = lang === 'ar' ? 'Unipocket — غير متصل' : 'Unipocket — Hors ligne';
  } catch (e) {}
</script>
<style>
  @font-face { font-family: 'Plus Jakarta Sans'; src: url('/fonts/PlusJakartaSans-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Plus Jakarta Sans'; src: url('/fonts/PlusJakartaSans-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Plus Jakarta Sans'; src: url('/fonts/PlusJakartaSans-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Plus Jakarta Sans'; src: url('/fonts/PlusJakartaSans-ExtraBold.woff2') format('woff2'); font-weight: 800; font-display: swap; }
  @font-face { font-family: 'Noto Naskh Arabic'; src: url('/fonts/NotoNaskhArabic-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; unicode-range: U+0020, U+00A0, U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: 'Noto Naskh Arabic'; src: url('/fonts/NotoNaskhArabic-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; unicode-range: U+0020, U+00A0, U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200F, U+FB50-FDFF, U+FE70-FEFF; }

  /* Token values copied from app/globals.css. */
  :root {
    --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-ar: 'Noto Naskh Arabic', 'Plus Jakarta Sans', 'Noto Naskh Arabic UI', 'Droid Arabic Naskh', 'Geeza Pro', 'Al Bayan', 'Traditional Arabic', 'Simplified Arabic', 'Segoe UI', serif;
    --r-md: 12px;
    --r-2xl: 24px;
    --dur-instant: 100ms;
    --dur-fast: 180ms;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #F7F4EE; --surface: #FFFFFF; --surface2: #F8F5EF;
    --ink: #1E231F; --ink2: #656B60; --hair2: rgba(30, 35, 31, .16);
    --jade: #1D9E75; --jade-hover: #22B083; --on-jade: #1E231F;
    --hero-bg: var(--jade); --hero-mark: var(--ink);
    --shadow-lg: 0 12px 32px rgba(30, 35, 31, .12);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #15201A; --surface: #1C2721; --surface2: #22302A;
    --ink: #EDF2ED; --ink2: #9FB0A6; --hair2: rgba(255, 255, 255, .14);
    --jade: #2BB989; --jade-hover: #3FCB9A; --on-jade: #0F1713;
    --hero-bg: var(--surface2); --hero-mark: var(--jade);
    --shadow-lg: 0 0 0 1px rgba(255, 255, 255, .08), 0 16px 40px rgba(0, 0, 0, .55);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--bg); color: var(--ink); }
  html[lang="ar"] body { font-family: var(--font-ar); }

  /* Both languages are in the markup; only the active one shows. */
  html[lang="fr"] [data-l="ar"], html[lang="ar"] [data-l="fr"] { display: none; }

  /* The session-waiting screen, as login.module.css draws it. */
  .screen { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
  .card { width: 100%; max-width: 420px; background: var(--surface); border-radius: var(--r-2xl); box-shadow: var(--shadow-lg); overflow: hidden; }
  .hero { position: relative; overflow: hidden; padding: 40px 32px 30px; text-align: center; color: var(--ink); background: var(--hero-bg); }
  .blob { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.07); pointer-events: none; }
  .blob-start { width: 180px; height: 180px; top: -70px; inset-inline-start: -40px; }
  .blob-end { width: 160px; height: 160px; top: -50px; inset-inline-end: -50px; }
  .mark { position: relative; display: block; height: 92px; aspect-ratio: 99 / 143; margin-inline: auto; background-color: var(--hero-mark);
    -webkit-mask: url('/logo.svg') center / contain no-repeat; mask: url('/logo.svg') center / contain no-repeat; }
  .brand { position: relative; margin: 14px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .tagline { position: relative; margin: 5px 0 0; font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .body { padding: 28px 28px 30px; }
  .notice { margin-bottom: 16px; padding: 12px 14px; border: 1px solid var(--hair2); border-radius: var(--r-md); background: var(--surface2); color: var(--ink2); font-size: 12.5px; line-height: 1.45; }
  .notice-title { display: block; margin-bottom: 2px; color: var(--ink); font-size: 13.5px; font-weight: 700; }
  .retry { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border: none; border-radius: var(--r-md); background: var(--jade); color: var(--on-jade);
    font-family: inherit; font-size: 15px; font-weight: 700; box-shadow: 0 8px 20px rgba(15, 110, 86, 0.25); cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out), transform var(--dur-instant) var(--ease-out); }
  .retry:hover { background: var(--jade-hover); }
  .retry:active { transform: scale(0.97); }
  .retry:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .retry { transition: none; } .retry:active { transform: none; } }
</style>
</head>
<body>
  <main class="screen">
    <div class="card">
      <header class="hero">
        <div class="blob blob-start" aria-hidden="true"></div>
        <div class="blob blob-end" aria-hidden="true"></div>
        <span class="mark" aria-hidden="true"></span>
        <h1 class="brand"><span data-l="fr">Université de Djibouti</span><span data-l="ar">جامعة جيبوتي</span></h1>
        <p class="tagline"><span data-l="fr">Votre espace étudiant</span><span data-l="ar">مساحتك الطلابية</span></p>
      </header>

      <div class="body">
        <div class="notice" role="status">
          <strong class="notice-title"><span data-l="fr">Vous êtes hors ligne</span><span data-l="ar">أنت غير متصل</span></strong>
          <span data-l="fr">Cette page n'est pas encore enregistrée sur cet appareil. Elle s'affichera dès que la connexion reviendra.</span>
          <span data-l="ar">هذه الصفحة غير محفوظة بعد على هذا الجهاز. ستظهر فور عودة الاتصال.</span>
        </div>

        <button type="button" class="retry" id="retry">
          <span data-l="fr">Réessayer</span><span data-l="ar">إعادة المحاولة</span>
        </button>
      </div>
    </div>
  </main>
  <script>
    // Retry is a reload: the worker tries the network again first. Coming back
    // online does the same on its own, so the student need not notice the switch.
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
