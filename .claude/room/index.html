<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Room · Unipocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0a11;--pn:#13111b;--ln:#25223a;--ink:#e8e5f2;--mu:#938fab;--am:#FBBF24}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "IBM Plex Mono",ui-monospace,monospace}
a{color:#c4b5fd}a:hover{color:#fff}
main{max-width:1060px;margin:0 auto;padding:14px 12px 40px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font:400 18px/1.1 Silkscreen,monospace;margin:0}
h1 span{color:var(--mu)}
.meta{display:flex;gap:10px;align-items:center;color:var(--mu);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);padding:2px 7px;font:400 10px Silkscreen,monospace;text-transform:uppercase;color:var(--ink)}
.chip i{width:6px;height:6px;background:#4ade80}
.stage{background:#06050a;border:1px solid var(--ln);display:flex;justify-content:center;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mu);font-size:11px;margin-top:-4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{display:inline-grid;place-items:center;width:14px;height:14px;font:400 10px Silkscreen,monospace}
.need{background:var(--am);color:#1b1305;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.need[hidden]{display:none}
.nrow{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;min-width:0}
.nrow b{font:400 12px Silkscreen,monospace;white-space:nowrap}
.nrow span{overflow-wrap:anywhere;min-width:0}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--pn);border:1px solid var(--ln);padding:9px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ch{display:flex;align-items:center;gap:7px;min-width:0}
.sw{width:10px;height:10px;background:var(--c);flex:none}
.ch b{font:400 12px Silkscreen,monospace;color:var(--c)}
.st{margin-left:auto;font:400 10px Silkscreen,monospace;text-transform:uppercase;color:var(--mu);border:1px solid var(--ln);padding:1px 5px}
.card[data-state=working] .st{color:#0b0a11;background:var(--c);border-color:var(--c)}
.card[data-state=waiting]{border-color:var(--am)}
.card[data-state=waiting] .st{background:var(--am);color:#1b1305;border-color:var(--am)}
.role{margin:0;color:var(--mu);font-size:11px;line-height:1.35}
.tx{margin:0;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-height:2.9em}
.log h2{font:400 12px Silkscreen,monospace;color:var(--mu);margin:6px 0 6px;display:flex;justify-content:space-between}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--ln)}
li{display:grid;grid-template-columns:42px 70px minmax(0,1fr) auto;gap:10px;padding:6px 2px;border-bottom:1px solid var(--ln);align-items:baseline}
li time{color:var(--mu);font-size:11px}
.who{font:400 11px Silkscreen,monospace;color:var(--c)}
.txt{overflow-wrap:anywhere;min-width:0}
.tag{font:400 9px Silkscreen,monospace;padding:1px 5px;text-transform:uppercase;white-space:nowrap}
.tag:empty{display:none}
.tag.flag{background:#F87171;color:#1a0707}.tag.done{background:#4ade80;color:#06210f}
li.you{background:#16141f}
li.you .txt{color:#fff}
li.fresh{animation:fresh 1.2s ease-out}
@keyframes fresh{from{background:#24203a}}
@keyframes pulse{50%{opacity:.6}}
.need{animation:pulse 1.6s steps(2) infinite}
@media(max-width:520px){li{grid-template-columns:auto 1fr auto;gap:2px 10px}.txt{grid-column:1/-1;grid-row:2}.tag{grid-column:3;grid-row:1}}
@media (prefers-reduced-motion:reduce){.need,li.fresh{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Agent Room <span>/ Unipocket</span></h1>
    <div class="meta"><span class="chip" id="src"><i></i><span>demo</span></span><span id="clock"></span></div>
  </header>
  <div class="need" id="need" hidden></div>
  <div class="stage" id="stage"><canvas id="room" width="256" height="176" aria-label="Pixel-art office showing the four agents"></canvas></div>
  <div class="legend">
    <span><b style="background:#FBBF24;color:#1b1305">?</b>waiting on you</span>
    <span><b style="background:#F87171;color:#1a0707">!</b>flag</span>
    <span><b style="background:#fff;color:#16a34a">✓</b>done</span>
    <span>lit monitor = working</span>
  </div>
  <section class="cards" id="cards"></section>
  <section class="log"><h2><span>Log</span><span id="count"></span></h2><ol id="log"></ol></section>
</main>
<script>
(()=>{
'use strict';
const W=256,H=176;
const cv=document.getElementById('room'),ctx=cv.getContext('2d');
const lc=document.createElement('canvas');lc.width=W;lc.height=H;const lx=lc.getContext('2d');
const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;
const mq=matchMedia('(prefers-reduced-motion: reduce)');let RM=mq.matches;
mq.addEventListener&&mq.addEventListener('change',e=>{RM=e.matches;});
let C=ctx,now=performance.now()/1000;
const A=()=>RM?0:now;
const R=(x,y,w,h,c)=>{if(w<=0||h<=0)return;C.fillStyle=c;C.fillRect(Math.round(x),Math.round(y),w,h);};
function hs(n){n=Math.imul((n|0)^0x9e3779b9,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);n^=n>>>16;return n>>>0;}
function ln(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;C.fillStyle=c;for(let i=0;i<99;i++){C.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
const GL={A:["010","101","111","101","101"],B:["110","101","110","101","110"],C:["011","100","100","100","011"],D:["110","101","101","101","110"],E:["111","100","110","100","111"],H:["101","101","111","101","101"],I:["111","010","010","010","111"],K:["101","101","110","101","101"],L:["100","100","100","100","111"],M:["10001","11011","10101","10001","10001"],N:["1001","1101","1011","1001","1001"],O:["010","101","101","101","010"],R:["110","101","110","101","101"],S:["011","100","010","001","110"],U:["101","101","101","101","111"],V:["101","101","101","101","010"],W:["10001","10001","10101","10101","01010"],'?':["111","001","010","000","010"],'!':["1","1","1","0","1"],'v':["00001","00011","10110","11100","01000"]};
function glyphW(s){let w=0;for(const ch of s){const g=GL[ch];w+=(g?g[0].length:2)+1;}return w-1;}
function text(s,x,y,c){C.fillStyle=c;for(const ch of s){const g=GL[ch];if(g){g.forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]==='1')C.fillRect(Math.round(x)+i,Math.round(y)+j,1,1);});x+=g[0].length+1;}else x+=3;}}

/* ---------- data contract ---------- */
const IDS=['lead','builder','reviewer','checker'];
const AG={
  lead:{color:'#A78BFA',role:'plans the work, writes MISSION.md'},
  builder:{color:'#34D399',role:'writes the code, opens the pull request'},
  reviewer:{color:'#FB923C',role:'reads the diff, never writes'},
  checker:{color:'#22D3EE',role:'compares the build to design/spec-pack'}
};
const STATES=['idle','working','waiting'];

/* ---------- people ---------- */
const LOOK={
  lead:{skin:'#c68a64',skinD:'#a56d4d',hair:'#2a1c26',top:'#A78BFA',topD:'#7a62c9',under:'#ece6f7',pants:'#2d3149',shoe:'#15141c',T:8,B:6,L:4},
  builder:{skin:'#8b5a3c',skinD:'#704631',hair:'#1a1412',top:'#34D399',topD:'#1f9a6c',pants:'#3a3f58',shoe:'#e8e8ee',T:6,B:8,L:3},
  reviewer:{skin:'#f0c49c',skinD:'#d6a27c',hair:'#8a3f1c',hairL:'#b45d2c',top:'#FB923C',topD:'#c9661e',pants:'#4b3a34',shoe:'#2a1c18',T:5,B:6,L:3},
  checker:{skin:'#b47a52',skinD:'#94603f',hair:'#1c1818',top:'#22D3EE',topD:'#1495ad',cap:'#0e6f82',pants:'#2a2e3f',shoe:'#f2f2f2',T:6,B:6,L:3}
};

/* ---------- floor plan ---------- */
const NODES=[[30,72],[62,72],[124,74],[190,76],[222,72],[28,132],[56,134],[124,128],[202,130],[226,130]];
const EDGES=[[0,1],[1,2],[2,3],[3,4],[5,6],[6,7],[7,8],[8,9],[0,5],[2,7],[4,9]];
const ADJ=NODES.map(()=>[]);EDGES.forEach(([a,b])=>{ADJ[a].push(b);ADJ[b].push(a);});
const SPOTS={
  lead_desk:{x:35,y:64,node:0,pose:'standwork',face:'back'},
  builder_desk:{x:124,y:68,node:2,pose:'sit',face:'back'},
  reviewer_desk:{x:202,y:120,node:8,pose:'sit',face:'back'},
  checker_desk:{x:56,y:126,node:6,pose:'sit',face:'back'},
  lead_wait:{x:56,y:68,node:0},
  builder_wait:{x:164,y:70,node:2},
  reviewer_wait:{x:154,y:122,node:8},
  checker_wait:{x:98,y:128,node:6},
  coffee:{x:210,y:64,node:4,face:'back'},
  winA:{x:80,y:61,node:1,face:'back'},
  winB:{x:172,y:62,node:3,face:'back'},
  bean1:{x:204,y:154,node:9,pose:'lounge'},
  bean2:{x:232,y:152,node:9,pose:'lounge'},
  cat:{x:54,y:158,node:5,pose:'crouch'},
  rug:{x:118,y:112,node:7},
  boxes:{x:30,y:104,node:5,face:'front'}
};
const PREF={
  lead:{winA:3,rug:3,winB:2,coffee:1},
  builder:{bean1:4,coffee:2,rug:1},
  reviewer:{coffee:3,bean2:2,winB:2},
  checker:{cat:4,winA:1,rug:2,bean2:1}
};
const SCR={lead:[[30,40,10,6]],builder:[[103,37,17,10],[128,37,17,10]],reviewer:[[192,83,16,10]],checker:[[48,91,16,10]]};
const START={lead:'winA',builder:'bean1',reviewer:'coffee',checker:'cat'};

const agents={};
IDS.forEach((id,i)=>{const s=SPOTS[START[id]];agents[id]={id,x:s.x,y:s.y,anchor:s.node,path:[],spotKey:START[id],idleSpot:START[id],arrived:true,pose:s.pose||'stand',face:s.face||'front',walkT:0,phase:i*1.7,state:'idle',text:'',kind:'',ts:0,waitText:'',on:false,litAt:0,pulse:-9,doneAt:-99,flagUntil:0,lingerUntil:0,dwellUntil:now+3+i*2,headTop:s.y-20};});

function bfs(s,t){if(s===t)return[s];const prev=new Array(NODES.length).fill(-1),q=[s],seen=new Set([s]);while(q.length){const n=q.shift();if(n===t)break;for(const m of ADJ[n])if(!seen.has(m)){seen.add(m);prev[m]=n;q.push(m);}}const out=[];let c=t;while(c!==-1){out.unshift(c);if(c===s)break;c=prev[c];}return out;}
function routeTo(a,key){const sp=SPOTS[key];a.spotKey=key;a.arrived=false;a.path=bfs(a.anchor,sp.node).map(n=>({x:NODES[n][0],y:NODES[n][1],n})).concat([{x:sp.x,y:sp.y,n:-1}]);}
function arrive(a){a.arrived=true;a.path=[];const sp=SPOTS[a.spotKey];a.anchor=sp.node;a.pose=sp.pose||'stand';a.face=sp.face||'front';if(a.state==='idle')a.dwellUntil=now+7+Math.random()*10;}
function pickIdle(a){const taken=new Set(IDS.filter(i=>i!==a.id).flatMap(i=>[agents[i].spotKey,agents[i].idleSpot]));const opts=Object.entries(PREF[a.id]).filter(([k])=>!taken.has(k)&&k!==a.idleSpot);if(!opts.length)return a.idleSpot;let tot=opts.reduce((s,o)=>s+o[1],0),r=Math.random()*tot;for(const [k,w] of opts){if((r-=w)<=0)return k;}return opts[0][0];}
function wantOf(a){return a.state==='working'?a.id+'_desk':a.state==='waiting'?a.id+'_wait':a.idleSpot;}
function snap(a){const k=wantOf(a);a.spotKey=k;const s=SPOTS[k];a.x=s.x;a.y=s.y;arrive(a);if(a.state==='working'){a.on=true;a.litAt=now-30;}else a.on=false;}

const SPEED=30;
function updAgent(a,dt){
  if(now<a.lingerUntil)return;
  if(a.state==='idle'&&a.arrived&&now>a.dwellUntil&&!a.spotKey.endsWith('_desk')&&!a.spotKey.endsWith('_wait')){a.idleSpot=pickIdle(a);a.dwellUntil=now+8;}
  const want=wantOf(a);
  if(want!==a.spotKey)routeTo(a,want);
  if(!a.arrived){
    if(RM){const s=SPOTS[a.spotKey];a.x=s.x;a.y=s.y;arrive(a);}
    else{const p=a.path[0];const dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy),st=SPEED*dt;
      if(d<=st){a.x=p.x;a.y=p.y;if(p.n>=0)a.anchor=p.n;a.path.shift();if(!a.path.length)arrive(a);}
      else{a.x+=dx/d*st;a.y+=dy/d*st;a.pose='walk';a.face=dy<-Math.abs(dx)*0.6?'back':'front';a.walkT+=dt;}}
  }
  const atDesk=a.arrived&&a.spotKey===a.id+'_desk'&&a.state==='working';
  if(atDesk&&!a.on){a.on=true;a.litAt=now;}
  if(!atDesk&&a.on)a.on=false;
}

/* ---------- particles ---------- */
const parts=[];
function spawn(x,y,n,cols,o={}){if(RM)return;for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*(o.sx??70),vy:-(o.up??40)-Math.random()*(o.vr??50),g:o.g??130,life:(o.life??1.4)*(.6+Math.random()*.6),c:cols[(Math.random()*cols.length)|0],w:o.w??1});}
function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0||p.y>H)parts.splice(i,1);}}

/* ---------- static background ---------- */
function drawBG(){
  C=bgc.getContext('2d');
  R(0,0,W,44,'#211e35');
  for(let x=0;x<W;x+=6)R(x,0,1,42,'#25223b');
  R(0,0,W,1,'#16142a');R(0,30,W,1,'#2a2742');
  R(0,42,W,4,'#2e2a47');R(0,42,W,1,'#3d3960');R(0,46,W,1,'#121019');
  const cols=['#31283b','#2d2537','#352b40'];
  for(let r=0;47+r*6<H;r++){const y=47+r*6;let x=-(hs(r)%30),k=0;while(x<W){const len=22+hs(r*97+k)%22;R(x,y,len,5,cols[hs(r*7+k)%3]);R(x,y,len,1,'#3a3046');R(x,y+5,len,1,'#221b29');R(x+len-1,y,1,5,'#261f2e');if(hs(r+k*13)%5===0)R(x+4+hs(k)%10,y+2,2,1,'#2a2232');x+=len;k++;}}
  R(0,47,W,2,'rgba(0,0,0,.3)');
  // rug
  R(96,84,64,58,'#2a1d33');R(98,86,60,54,'#57365a');R(100,88,56,50,'#432a4a');
  for(let i=0;i<7;i++)for(let j=0;j<6;j++){const cx=104+i*8,cy=92+j*8;R(cx+1,cy,1,1,'#6a4568');R(cx,cy+1,3,1,'#6a4568');R(cx+1,cy+2,1,1,'#6a4568');}
  R(102,90,52,1,'#6a4568');R(102,135,52,1,'#6a4568');
  for(let x=98;x<158;x+=2){R(x,83,1,1,'#7a6380');R(x,142,1,1,'#7a6380');}
  // cable from builder desk
  ln(158,61,162,66,'#17151f');ln(162,66,160,74,'#17151f');R(156,74,8,3,'#d6d2c4');R(157,75,1,1,'#f87171');
  C=ctx;
}

/* ---------- wall layer ---------- */
function win(x,y,w,h,seed,moon){
  const t=A();
  R(x-2,y-2,w+4,h+4,'#433d63');
  const bands=['#0d1330','#111a3d','#16204a','#1c2756'];
  for(let i=0;i<h;i++)R(x,y+i,w,1,bands[Math.min(3,(i/h*4)|0)]);
  for(let i=0;i<7;i++){const sx=x+hs(seed+i)%w,sy=y+hs(seed+i*7)%(h>>1);if(RM||Math.sin(t*2+i*1.7)<.7)R(sx,sy,1,1,'#c9d2ff');}
  if(moon){R(x+w-10,y+3,4,6,'#efe7c8');R(x+w-11,y+4,6,4,'#efe7c8');R(x+w-9,y+5,1,1,'#d6cca8');R(x+w-8,y+7,1,1,'#d6cca8');}
  let bx=x,k=0;
  while(bx<x+w){const bw=4+hs(seed*3+k)%6,bh=6+hs(seed*5+k)%(h-11),ww=Math.min(bw,x+w-bx);R(bx,y+h-bh,ww,bh,k%2?'#090b18':'#0c0f20');
    for(let wy=y+h-bh+2;wy<y+h-1;wy+=2)for(let wx=bx+1;wx<bx+ww-1;wx+=2){const q=hs(wx*13+wy*7+seed);if(q%4===0){const off=!RM&&((Math.floor(t*.25+(q&31))%13)===0);if(!off)R(wx,wy,1,1,q%3?'#f5c46b':'#9ad7ff');}}
    if(hs(seed+k*3)%4===0&&bh>12){R(bx+(ww>>1),y+h-bh-3,1,3,'#0c0f20');if(RM||Math.floor(t*1.2+k)%2)R(bx+(ww>>1),y+h-bh-4,1,1,'#f87171');}
    bx+=bw;k++;}
  R(x+(w>>1),y,1,h,'#433d63');R(x,y+(h>>1)-2,w,1,'#433d63');
  R(x-3,y+h+2,w+6,2,'#565080');R(x-3,y+h+4,w+6,1,'#1a1828');
}
let board=0,boardChecked=0,youAt=-99;
function wall(){
  const t=A();
  win(64,8,30,26,11,false);win(158,8,28,26,23,true);
  // succulent on window sill
  R(88,33,5,3,'#a0583c');R(89,30,1,3,'#4a9a66');R(91,29,1,4,'#3a8457');R(90,31,1,2,'#5bb07a');
  // whiteboard
  R(8,8,46,28,'#8a8ea3');R(9,9,44,26,'#d4d6e2');R(9,9,44,1,'#e8eaf2');
  text('MISSION',11,11,'#6d4fd0');
  for(let i=0;i<6;i++){const y=18+i*3,len=10+hs(i*5+3)%16,p=Math.max(0,Math.min(1,board-i));if(p<=0)break;R(11,y,2,2,i<boardChecked?'#2f9e6a':'#5a5a70');R(15,y,Math.round(len*p),1,'#4a4a68');}
  R(44,12,7,6,'#f6d365');R(45,14,4,1,'#b89a3a');R(45,20,7,6,'#f9a8d4');R(46,22,4,1,'#b86a90');R(44,28,7,5,'#86efac');R(45,30,3,1,'#3f9a62');
  R(10,35,42,1,'#6c7088');R(14,34,3,1,'#e05a5a');R(18,34,3,1,'#3b82f6');R(22,34,3,1,'#16a34a');
  // clock (real local time)
  const d=new Date();R(120,8,9,11,'#d6d0bf');R(119,9,11,9,'#d6d0bf');R(119,9,1,1,'#211e35');
  R(124,9,1,1,'#555');R(124,17,1,1,'#555');R(120,13,1,1,'#555');R(128,13,1,1,'#555');
  const am=(d.getMinutes()/60)*Math.PI*2,ah=((d.getHours()%12)/12+d.getMinutes()/720)*Math.PI*2;
  ln(124,13,124+Math.round(Math.sin(am)*4),13-Math.round(Math.cos(am)*4),'#2a2833');
  ln(124,13,124+Math.round(Math.sin(ah)*2.4),13-Math.round(Math.cos(ah)*2.4),'#b4483a');
  // beacon + intercom

    while(rem>0){let seg=Math.min(rem,2+((h>>>(8+k*3))%5));seg=Math.min(seg,sx+sw-1-cx);if(seg<=0)break;R(cx,yy,seg,1,cols[(h>>>(k*2+3))%cols.length]);cx+=seg+1;rem-=seg;k++;}

}

function bubble(x,y,bg,fg,g){

function addLog(e){

  if(e.agent==='you')li.className='you';

let quietMode=false;
function apply(raw,quiet){

  quietMode=!!quiet;addLog(e);quietMode=false;

    const prev=a.state;
    if(STATES.includes(e.state)&&e.state!==a.state){a.state=e.state;if(e.state==='waiting')a.waitText=e.text;if(e.state==='idle'){a.idleSpot=pickIdle(a);}}

    if(!quiet){
      a.pulse=now;
      if(a.on){const s=SCR[a.id][0];spawn(s[0]+s[2]/2,s[1],5,[AG[a.id].color,'#ffffff'],{sx:30,up:15,vr:15,g:40,life:.6});}

}

let mode='boot',demoTimer=0,demoI=0;
function demoStep(){
  if(mode!=='demo')return;

let seen=0;
const lines=t=>t.split(/\r?\n/).filter(l=>l.trim());
function parse(l){try{const o=JSON.parse(l);return o&&typeof o==='object'?o:null;}catch(e){return null;}}
function startFile(ls){
  stopDemo();mode='file';setSrc('file');doReset();
  const evs=ls.map(parse).filter(Boolean),K=6,head=evs.length>K?evs.slice(0,evs.length-K):[];
  head.forEach(e=>apply(e,true));IDS.forEach(id=>snap(agents[id]));

}
async function getFile(){try{const r=await fetch('./events.ndjson',{cache:'no-store'});if(!r.ok)return null;return await r.text();}catch(e){return null;}}
async function poll(){
  const t=await getFile();if(t==null)return;const ls=lines(t);if(!ls.length)return;
  if(mode!=='file'){startFile(ls);return;}
  if(ls.length<seen){startFile(ls);return;}
  ls.slice(seen).map(parse).filter(Boolean).forEach(e=>queue.push({ev:e,gap:.45}));seen=ls.length;
}

};
